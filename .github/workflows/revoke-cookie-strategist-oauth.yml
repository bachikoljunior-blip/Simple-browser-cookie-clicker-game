name: クッキーストラテジャー投稿認証停止

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/revoke-cookie-strategist-oauth.yml'

permissions:
  contents: read

jobs:
  revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 対象チャンネルを確認して投稿認証を失効
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = ['YT_CLIENT_ID', 'YT_CLIENT_SECRET', 'YT_REFRESH_TOKEN'];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }

          const refresh = async () => {
            const res = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                client_id: process.env.YT_CLIENT_ID,
                client_secret: process.env.YT_CLIENT_SECRET,
                refresh_token: process.env.YT_REFRESH_TOKEN,
                grant_type: 'refresh_token',
              }),
            });
            const body = await res.json();
            return { res, body };
          };

          const first = await refresh();
          if (!first.res.ok || !first.body.access_token) {
            throw new Error(`認証確認失敗: ${first.res.status} ${first.body.error || ''}`);
          }

          const channelRes = await fetch(
            'https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true',
            { headers: { authorization: `Bearer ${first.body.access_token}` } },
          );
          const channelBody = await channelRes.json();
          const title = channelBody.items?.[0]?.snippet?.title;
          if (!channelRes.ok || title !== 'クッキーストラテジャー') {
            throw new Error(`誤操作防止: 接続先は「${title || '確認不能'}」`);
          }

          const revokeRes = await fetch('https://oauth2.googleapis.com/revoke', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ token: process.env.YT_REFRESH_TOKEN }),
          });
          if (!revokeRes.ok) {
            throw new Error(`OAuth失効失敗: ${revokeRes.status}`);
          }

          await new Promise(resolve => setTimeout(resolve, 1500));
          const check = await refresh();
          if (check.res.ok) {
            throw new Error('停止確認失敗: refresh token がまだ使用できます');
          }
          console.log(`停止確認OK: ${title} の投稿用refresh tokenは使用不能`);
          NODE
