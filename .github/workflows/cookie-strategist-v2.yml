name: クッキーストラテジャー自動運用 v2

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '予約待ちを無視して今すぐ1本投稿する'
        required: false
        default: false
        type: boolean
concurrency:
  group: cookie-strategist-v2
  cancel-in-progress: false

env:
  PROMO_REF: automation/cookie-strategist-v2

jobs:
  analyze-create-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    steps:
      - name: 投稿コードを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROMO_REF }}
          fetch-depth: 0

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 認証・対象チャンネル・投稿間隔を確認
        id: gate
        working-directory: promo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          missing=()
          for name in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::YouTube認証情報が未設定: ${missing[*]}"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { accessToken, channel, channelVideos, grantedScopes } from './youtube/yt.mjs';

          const expectedTitle = 'クッキーストラテジャー';
          const c = await channel();
          if (c.title !== expectedTitle) {
            throw new Error(`誤投稿防止: 接続先は「${c.title}」。期待値は「${expectedTitle}」`);
          }

          const scopes = await grantedScopes();
          const canUpload = scopes.some(s =>
            s.endsWith('/youtube.upload') ||
            s.endsWith('/youtube.force-ssl') ||
            s.endsWith('/youtube'));
          const canAnalyze = scopes.some(s =>
            s.endsWith('/yt-analytics.readonly') ||
            s.endsWith('/yt-analytics-monetary.readonly'));
          if (!canUpload) throw new Error('OAuthにYouTube投稿権限がありません');
          if (!canAnalyze) throw new Error('OAuthにYouTube Analytics読取権限がありません');

          const videos = await channelVideos(50);
          const token = await accessToken();
          const ids = videos.map(v => v.id);
          let statusItems = [];
          if (ids.length) {
            const url = new URL('https://www.googleapis.com/youtube/v3/videos');
            url.search = new URLSearchParams({
              part: 'status,snippet',
              id: ids.join(','),
              maxResults: '50',
            });
            const res = await fetch(url, { headers: { authorization: `Bearer ${token}` } });
            if (!res.ok) throw new Error(`予約確認に失敗: ${res.status} ${await res.text()}`);
            statusItems = (await res.json()).items || [];
          }

          const now = Date.now();
          const scheduled = statusItems.filter(v =>
            v.status?.publishAt && Date.parse(v.status.publishAt) > now);
          const recentPublic = statusItems.filter(v =>
            v.status?.privacyStatus === 'public' &&
            Date.parse(v.snippet?.publishedAt || 0) > now - 20 * 3600_000);
          const force = process.env.FORCE === 'true';
          const shouldPost = force || (scheduled.length === 0 && recentPublic.length === 0);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `post=${shouldPost}\n`);
          console.log(`対象: ${c.title} / 登録者 ${c.subscribers} / 総再生 ${c.views} / 動画 ${c.videos}`);
          console.log(`将来の予約 ${scheduled.length}本 / 直近20時間の公開 ${recentPublic.length}本`);
          console.log(shouldPost
            ? '判定: 分析後に新しい動画を作って公開します'
            : '判定: 既存の公開間隔を守るため、今日は分析だけ行います');
          NODE

      - name: アナリティクスを分析
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        working-directory: promo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node youtube/diag.mjs

      - name: 公開済み動画に参加コメントを置く
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        working-directory: promo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node youtube/ask.mjs --pending --limit=3

      - name: 参加コメント履歴を保存
        if: steps.gate.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain -- promo/youtube/asked.json)" ]; then
            echo "新しい参加コメントなし"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add promo/youtube/asked.json
          git commit -m "参加コメント履歴を更新"
          git push origin "HEAD:${PROMO_REF}"

      - name: 動画生成環境を準備
        if: steps.gate.outputs.post == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg open-jtalk \
            open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          npm ci --omit=dev || npm install --no-audit --no-fund
          npm install --no-save playwright-core
          npx playwright install --with-deps chromium

      - name: ゲームを収録可能にする
        if: steps.gate.outputs.post == 'true'
        run: |
          python3 -m http.server 8765 >/tmp/cookie-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8765/play.html && break
            sleep 0.5
          done
          curl -sf -o /dev/null http://localhost:8765/play.html

      - name: 分析結果から動画を作って公開
        if: steps.gate.outputs.post == 'true'
        working-directory: promo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PROMO_AUTONOMOUS_QA: '1'
          PROMO_LENGTH: short
        run: node youtube/autopost.mjs --public

      - name: 投稿履歴を保存
        if: steps.gate.outputs.post == 'true'
        run: |
          if [ -z "$(git status --porcelain -- promo/youtube/posted.json)" ]; then
            echo "::error::公開後の投稿履歴が更新されていません"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add promo/youtube/posted.json
          git commit -m "クッキーストラテジャーの投稿履歴を更新"
          git push origin "HEAD:${PROMO_REF}"

      - name: 成功時に停止通知を閉じる
        if: success() && steps.gate.outputs.post == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "${{ github.repository }}" --state open \
            --search '"[自動投稿停止] クッキーストラテジャー" in:title' \
            --json number --jq '.[].number' |
          while read -r number; do
            [ -z "$number" ] && continue
            gh issue close "$number" --repo "${{ github.repository }}" \
              --comment "自動投稿が正常に完了したため閉じます。"
          done

      - name: 失敗時に停止通知を残す
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[自動投稿停止] クッキーストラテジャー'
          number="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          body="自動分析・動画生成・公開の実行に失敗しました。ログ: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi

      - name: 失敗時の動画素材を5日保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cookie-strategist-debug
          path: |
            promo/trim.json
            promo/cookie_strateger_short.mp4
          if-no-files-found: ignore
          retention-days: 5
