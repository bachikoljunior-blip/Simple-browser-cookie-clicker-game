name: 1. 署名鍵をつくる

# Google Play にアップロードするアプリの署名鍵(アップロード鍵)を生成します。
# PC が無くても、GitHub の画面からこのワークフローを実行するだけで作れます。
#
# 【このリポジトリは公開(public)です】
# 公開リポジトリでは Actions のログ・実行サマリー・Artifacts が誰でも閲覧できます。
# そのため鍵そのものは一切そこへ出しません。生成した鍵は
# パスフレーズ(Secret)で AES-256 暗号化して store/android/upload-keystore.jks.enc
# として commit します。暗号化ファイルだけでは鍵は取り出せません。
#
# 実行前に Secret `ANDROID_KEYSTORE_PASSPHRASE` を登録しておいてください。
# これ1つがキーストアのパスワード・鍵のパスワード・暗号化のパスフレーズを兼ねます。
#
# 【重要】一度作ったら二度と実行しないこと。
# 作り直すと別の鍵になり、Play にアップロード済みのアプリを更新できなくなります。

on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: '既に鍵がある場合に作り直す(通常は空欄。作り直すなら REPLACE と入力)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_ENC: store/android/upload-keystore.jks.enc
      KEY_ALIAS: upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: パスフレーズと既存の鍵を確認
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASS:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSPHRASE が未登録です。Settings → Secrets and variables → Actions で登録してから実行してください。"
            exit 1
          fi
          if [ "${#PASS}" -lt 12 ]; then
            echo "::error::パスフレーズが短すぎます(${#PASS}文字)。暗号化した鍵は公開リポジトリに入るため、16文字以上を強く推奨します。"
            exit 1
          fi
          if [ -f "$KEYSTORE_ENC" ] && [ "${{ inputs.replace_existing }}" != "REPLACE" ]; then
            echo "::error::$KEYSTORE_ENC が既に存在します。作り直すとPlayのアプリを更新できなくなります。本当に作り直す場合のみ replace_existing に REPLACE と入力してください。"
            exit 1
          fi

      - name: 署名鍵を生成して暗号化
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p store/android
          keytool -genkeypair \
            -keystore /tmp/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Cookie Strateger, OU=Cookie Strateger, O=Cookie Strateger, L=Tokyo, S=Tokyo, C=JP"

          # 暗号化した状態でだけリポジトリに置く(平文の .jks はここから外に出さない)
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -md sha512 -salt \
            -in /tmp/upload-keystore.jks -out "$KEYSTORE_ENC" -pass env:PASS

          # 復号して元に戻ることを確認してから commit する
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha512 \
            -in "$KEYSTORE_ENC" -out /tmp/roundtrip.jks -pass env:PASS
          cmp /tmp/upload-keystore.jks /tmp/roundtrip.jks
          echo "暗号化と復号の往復を確認しました"

          SHA256=$(keytool -list -v -keystore /tmp/upload-keystore.jks \
            -alias "$KEY_ALIAS" -storepass "$PASS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "UPLOAD_SHA256=$SHA256" >> "$GITHUB_ENV"

          shred -u /tmp/upload-keystore.jks /tmp/roundtrip.jks

      - name: commit する
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$KEYSTORE_ENC"
          git commit -m "アップロード鍵(暗号化済み)を追加"
          git push

      - name: 次にやることを表示
        run: |
          {
            echo "## 署名鍵ができました"
            echo
            echo "暗号化した鍵を \`$KEYSTORE_ENC\` として commit しました。"
            echo "以降のビルドはこれを自動で使うので、ファイルの持ち回しは不要です。"
            echo
            echo "### アップロード鍵の SHA-256 指紋"
            echo
            echo '```'
            echo "$UPLOAD_SHA256"
            echo '```'
            echo
            echo "（この指紋は assetlinks.json に公開する値なので、ここに出して問題ありません）"
            echo
            echo "### ⚠️ パスフレーズを必ず保管してください"
            echo
            echo "\`ANDROID_KEYSTORE_PASSPHRASE\` を忘れると鍵を復号できず、"
            echo "**公開後のアプリを永久に更新できなくなります。**"
            echo "iPhone のパスワードアプリ（iCloud キーチェーン）などに保存しておいてください。"
            echo
            echo "### 次の手順"
            echo
            echo "1. **「3. assetlinks.json を更新」** を空欄で実行（アップロード鍵の分を先に反映）"
            echo "2. **「2. Androidアプリをビルド」** を実行して AAB を作る"
          } >> "$GITHUB_STEP_SUMMARY"
