name: 1. 署名鍵をつくる

# Google Play にアップロードするアプリの署名鍵(アップロード鍵)を生成します。
# PC が無くても、GitHub の画面からこのワークフローを実行するだけで作れます。
#
# 【重要】この鍵を失うとアプリを更新できなくなります。実行後に必ず
# ・Secrets へ登録する(手順は実行結果のサマリーに出ます)
# ・ダウンロードした .jks ファイルを自分の手元にも保管する
# の両方をやってください。
#
# 一度作ったら二度と実行しないこと。作り直すと別の鍵になり、
# Play にアップロード済みのアプリを更新できなくなります。

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'キーストアのパスワード(6文字以上・忘れないもの)'
        required: true
      key_alias:
        description: '鍵のエイリアス'
        required: true
        default: 'upload'

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17 を用意
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 署名鍵を生成
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          if [ "${#KS_PASS}" -lt 6 ]; then
            echo "::error::パスワードは6文字以上にしてください"
            exit 1
          fi
          mkdir -p out
          keytool -genkeypair \
            -keystore out/upload-keystore.jks \
            -alias "$KS_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Cookie Strateger, OU=Cookie Strateger, O=Cookie Strateger, L=Tokyo, S=Tokyo, C=JP"

      - name: base64 と指紋を書き出す
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
        run: |
          set -euo pipefail
          base64 -w0 out/upload-keystore.jks > out/upload-keystore.base64.txt
          keytool -list -v -keystore out/upload-keystore.jks \
            -alias "$KS_ALIAS" -storepass "$KS_PASS" > out/keystore-info.txt
          SHA256=$(grep -m1 'SHA256:' out/keystore-info.txt | sed 's/.*SHA256: *//')
          echo "$SHA256" > out/sha256-fingerprint.txt
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: out/
          retention-days: 7

      - name: 次にやることを表示
        run: |
          {
            echo "## 署名鍵ができました"
            echo
            echo "### アップロード鍵の SHA-256 指紋"
            echo '```'
            echo "$SHA256"
            echo '```'
            echo
            echo "### これから必ずやること"
            echo
            echo "1. このページ下部の **Artifacts → upload-keystore** をダウンロードし、"
            echo "   \`upload-keystore.jks\` を自分のスマホ/クラウドに保管してください。"
            echo "   **これを失うとアプリを二度と更新できません。**"
            echo "2. リポジトリの **Settings → Secrets and variables → Actions** で、"
            echo "   次の3つの Secret を登録してください。"
            echo
            echo "   | Secret 名 | 入れる値 |"
            echo "   |---|---|"
            echo "   | \`ANDROID_KEYSTORE_BASE64\` | ダウンロードした \`upload-keystore.base64.txt\` の中身をそのまま貼る |"
            echo "   | \`ANDROID_KEYSTORE_PASSWORD\` | いま入力したパスワード |"
            echo "   | \`ANDROID_KEY_ALIAS\` | \`${{ inputs.key_alias }}\` |"
            echo
            echo "3. 登録が終わったら、この実行の Artifacts は削除して構いません"
            echo "   (base64 がログや成果物に残り続けるのを避けるため)。"
            echo "4. 次は **「2. Androidアプリをビルド」** ワークフローを実行します。"
          } >> "$GITHUB_STEP_SUMMARY"
