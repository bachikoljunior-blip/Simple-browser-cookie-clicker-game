name: クッキーストラテジャー完全停止

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stop-cookie-strategist.yml'

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/cookie-strategist-revenue-v3
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 未来の予約をすべて外して非公開に戻す
        working-directory: promo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { channel, queue, unschedule } from './youtube/yt.mjs';

          const c = await channel();
          if (c.title !== 'クッキーストラテジャー') {
            throw new Error(`誤操作防止: 接続先は「${c.title}」`);
          }

          const before = await queue();
          console.log(`停止前の未来予約: ${before.length}本`);
          for (const v of before) {
            const stopped = await unschedule(v.id);
            if (stopped.publishAt || stopped.privacy !== 'private') {
              throw new Error(`停止確認失敗: ${v.id}`);
            }
            console.log(`停止: ${v.id} ${v.title}`);
          }

          const after = await queue();
          if (after.length) {
            throw new Error(`未来予約が${after.length}本残っています`);
          }
          console.log('停止確認OK: 未来予約0本');
          NODE
