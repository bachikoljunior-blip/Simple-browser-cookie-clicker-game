<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>クッキーストラテジャー プロモ コンポジタ</title>
<style>
  @font-face { font-family: "PromoJP"; src: url("fonts/NotoSansJP-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: "PromoJP"; src: url("fonts/NotoSansJP-Bold.ttf")    format("truetype"); font-weight: 700; font-display: block; }
  @font-face { font-family: "PromoJP"; src: url("fonts/NotoSansJP-Black.ttf")   format("truetype"); font-weight: 900; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "PromoJP", sans-serif; -webkit-font-smoothing: antialiased; }

  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05030a; }

  /* ── ゲーム映像レイヤー ───────────────────────────────── */
  #gameWrap { position: absolute; inset: 0; overflow: hidden; }
  #gameWrap img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; will-change: transform; }

  /* ── 画づくり(周辺減光・上下の締め) ───────────────────── */
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 78% at 50% 44%, rgba(0,0,0,0) 46%, rgba(0,0,0,.30) 78%, rgba(0,0,0,.62) 100%),
      linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 66%, rgba(0,0,0,.60) 100%);
  }
  #grade { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
           background: linear-gradient(180deg, rgba(255,196,92,.16), rgba(255,255,255,0) 46%, rgba(70,30,140,.10)); }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #FFEDCB; opacity: 0; }
  /* 殴っている間だけ、画面のふちを熱くする */
  #hitFx { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
           background: radial-gradient(66% 52% at 40% 32%, rgba(255,170,60,0) 46%, rgba(255,110,30,.62) 100%); }
  /* テロップの下に敷く暗幕。文字が乗る帯だけ静かに沈める */
  #scrim { position: absolute; left: 0; right: 0; pointer-events: none; opacity: 0;
           background: radial-gradient(72% 100% at 50% 50%, rgba(6,3,1,.86), rgba(6,3,1,.55) 55%, rgba(6,3,1,0) 100%); }

  /* ── テロップ共通 ────────────────────────────────────── */
  .layer { position: absolute; inset: 0; pointer-events: none; }

  .hookLine {
    position: absolute; left: 0; right: 0; text-align: center;
    font-weight: 900; letter-spacing: .01em; line-height: 1.16;
    color: #fff;
    text-shadow: 0 6px 0 rgba(60,20,0,.55), 0 0 46px rgba(255,168,40,.75), 0 14px 46px rgba(0,0,0,.85);
  }
  .hookLine em { font-style: normal; color: #FFD46B; }

  /* 章タグ: 左から差し込む数字バッジ + 見出し */
  .chapter { position: absolute; left: 62px; display: flex; align-items: center; gap: 22px; }
  .chapter .num {
    width: 100px; height: 100px; border-radius: 25px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 56px; color: #2a1503;
    background: linear-gradient(160deg, #FFE9A8, #F2A93B 62%, #C97A16);
    box-shadow: 0 12px 34px rgba(0,0,0,.6), inset 0 3px 0 rgba(255,255,255,.65);
  }
  .chapter .txt { display: flex; flex-direction: column; gap: 10px; }
  .chapter .ttl {
    font-weight: 900; font-size: 60px; color: #fff; letter-spacing: .005em; white-space: nowrap;
    text-shadow: 0 5px 0 rgba(50,18,0,.5), 0 10px 34px rgba(0,0,0,.85);
  }
  .chapter .bar { height: 9px; border-radius: 9px; background: linear-gradient(90deg, #FFD46B, #FF8A3D); transform-origin: left center; box-shadow: 0 0 22px rgba(255,170,60,.85); }

  /* 下段のひとこと */
  .caption {
    position: absolute; left: 56px; right: 56px;
    padding: 24px 30px; border-radius: 24px;
    /* ゲーム画面の上に乗るので、下の絵が透けすぎないよう少し濃いめにする */
    background: linear-gradient(180deg, rgba(16,8,3,.90), rgba(16,8,3,.80));
    border: 3px solid rgba(255,196,102,.50);
    box-shadow: 0 18px 48px rgba(0,0,0,.6);
    font-weight: 700; font-size: 44px; line-height: 1.36; color: #FFF3DD; text-align: center;
  }
  .caption b { color: #FFD46B; font-weight: 900; }

  /* 数字を指し示すハイライトリング */
  .spot { position: absolute; border-radius: 999px; border: 7px solid rgba(255,226,140,1);
          box-shadow: 0 0 0 5px rgba(56,22,0,.8), 0 0 0 13px rgba(255,170,50,.30),
                      0 0 46px rgba(255,180,60,.95), inset 0 0 30px rgba(56,22,0,.35); }

  /* ── しめ(CTA) ──────────────────────────────────────── */
  #cta { position: absolute; inset: 0; opacity: 0; }
  #ctaBg { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: saturate(1.05) brightness(.78); }
  #ctaShade { position: absolute; inset: 0; background:
      radial-gradient(96% 64% at 50% 34%, rgba(70,26,0,0), rgba(6,3,10,.62) 80%),
      linear-gradient(180deg, rgba(6,3,10,.42), rgba(6,3,10,.05) 26%, rgba(6,3,10,.70)); }
  #ctaInner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  #ctaLogo { width: 700px; margin-top: 128px; filter: drop-shadow(0 18px 40px rgba(0,0,0,.75)); }

  .ctaBadge {
    margin-top: 40px; padding: 16px 40px; border-radius: 999px;
    font-weight: 900; font-size: 40px; letter-spacing: .06em; color: #10240f;
    background: linear-gradient(160deg, #B6F5A0, #56D06A 60%, #2FA050);
    box-shadow: 0 12px 34px rgba(0,0,0,.55), inset 0 3px 0 rgba(255,255,255,.55);
  }
  .ctaHead {
    margin-top: 42px; font-weight: 900; font-size: 116px; line-height: 1.06; color: #fff; text-align: center;
    text-shadow: 0 8px 0 rgba(60,20,0,.5), 0 0 60px rgba(255,170,50,.7), 0 18px 60px rgba(0,0,0,.9);
  }
  .ctaHead span { color: #FFD46B; }
  .ctaSub { margin-top: 28px; font-weight: 700; font-size: 50px; color: #FFE9C4; text-align: center; line-height: 1.4;
            text-shadow: 0 4px 18px rgba(0,0,0,.95), 0 0 34px rgba(0,0,0,.8); }

  .ctaPanel {
    margin-top: 54px; width: 900px; padding: 36px 34px 34px; border-radius: 34px; text-align: center;
    background: linear-gradient(180deg, rgba(22,12,5,.90), rgba(14,7,3,.78));
    border: 4px solid rgba(255,196,102,.55);
    box-shadow: 0 22px 60px rgba(0,0,0,.7), inset 0 0 60px rgba(255,160,40,.10);
  }
  .ctaPanel .k { font-weight: 900; font-size: 54px; color: #FFD46B; line-height: 1.3; }
  .ctaPanel .v { margin-top: 14px; font-weight: 700; font-size: 40px; color: #FFF3DD; line-height: 1.45; }
  .ctaArrow { margin-top: 26px; font-size: 76px; color: #FFD46B; text-shadow: 0 0 40px rgba(255,180,60,.9); }
  .ctaFoot { position: absolute; left: 0; right: 0; bottom: 132px; text-align: center;
             font-weight: 700; font-size: 38px; color: #F0E2CB; letter-spacing: .02em;
             text-shadow: 0 4px 16px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.85); }

  /* きらめき */
  .spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #FFE6A8;
           box-shadow: 0 0 22px 6px rgba(255,196,90,.85); }
</style>
</head>
<body>
<div id="stage">
  <div id="gameWrap">
    <img id="gameA" alt="">
  </div>
  <div id="grade"></div>
  <div id="vignette"></div>

  <div class="layer" id="fx"></div>
  <div id="hitFx"></div>
  <div id="scrim"></div>

  <div class="layer" id="tele">
    <div class="hookLine" id="hook1"></div>
    <div class="hookLine" id="hook2"></div>

    <div class="chapter" id="chap">
      <div class="num" id="chapNum">1</div>
      <div class="txt">
        <div class="ttl" id="chapTtl">設備でクッキーを増やす</div>
        <div class="bar" id="chapBar"></div>
      </div>
    </div>

    <div class="caption" id="cap"></div>
    <div class="spot" id="spot"></div>
  </div>

  <div id="cta">
    <div id="ctaBg"></div>
    <div id="ctaShade"></div>
    <div id="ctaInner">
      <img id="ctaLogo" src="../images/logo_title.webp" alt="">
      <div class="ctaBadge" id="ctaBadge">Google Play</div>
      <div class="ctaHead" id="ctaHead">テスター<span>募集中</span></div>
      <div class="ctaSub" id="ctaSub">Google Play ストア版のテスターを<br>募集しています</div>
      <div class="ctaPanel" id="ctaPanel">
        <div class="k">登録方法は<br>チャンネル説明欄に</div>
        <div class="v">参加のしかたを載せています</div>
        <div class="ctaArrow" id="ctaArrow">▼</div>
      </div>
      <div class="ctaFoot" id="ctaFoot">基本プレイ無料 ／ アプリ内に広告なし</div>
    </div>
  </div>

  <div id="flash"></div>
</div>

<script src="timeline.js"></script>
</body>
</html>
